name = "yoga-website"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "yoga-db"
database_id = "33a21ab8-e6e9-42ce-9b95-3a055538a90f"

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "yoga-videos"

[[kv_namespaces]]
binding = "RATE"
id = "0382396ac8db4759bd8dcc83133a7e5f"

[vars]
APP_URL = "https://yoga-website.YOUR-SUBDOMAIN.workers.dev"
BRAND = "Stillwater Yoga"
PRICE_LABEL = "$19 / month"
STRIPE_PRICE_ID = "price_REPLACE"
PAYPAL_ENV = "sandbox"
PAYPAL_CLIENT_ID = "REPLACE"
PAYPAL_PLAN_ID = "P-REPLACE"

# Secrets (set with `wrangler secret put NAME`, never commit):
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, PAYPAL_CLIENT_SECRET, PAYPAL_WEBHOOK_ID
